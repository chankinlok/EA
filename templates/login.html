{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center text-warning mb-4">會員登入</h3>
            <form action="{{ url_for('login') }}" method="POST" id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">使用者名稱</label>
                    <input type="text" name="username" class="form-control bg-dark text-light" id="usernameInput" required>
                    <div class="invalid-feedback">請輸入使用者名稱！</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密碼</label>
                    <input type="password" name="password" class="form-control bg-dark text-light" id="passwordInput" required>
                    <div class="invalid-feedback">請輸入密碼！</div>
                </div>
                <button type="submit" class="btn btn-warning w-100">登入</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
