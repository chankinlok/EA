<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>{% block title %}Commonroom — A place to talk{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forum.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('home') }}" aria-label="Commonroom home">
        <span class="wordmark-icon" aria-hidden="true">c</span>
        <span>commonroom</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="{{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('home') }}#categories">Categories</a>
        <a class="nav-login {{ 'active' if request.endpoint == 'login' else '' }}" href="{{ url_for('login') }}">Log in <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <a class="wordmark footer-wordmark" href="{{ url_for('home') }}">
        <span class="wordmark-icon" aria-hidden="true">c</span>
        <span>commonroom</span>
      </a>
      <p>Good conversations start with showing up.</p>
      <span class="footer-copyright">© 2026 Commonroom</span>
    </footer>
  </body>
</html>
